<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Система HelpDesk v.1.2</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #fff; height: 100vh; overflow: hidden; }
        .login-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { width: 340px; background: #2b2b2b; padding: 35px 30px; border-radius: 15px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .login-box h2 { margin: 0 0 25px 0; font-size: 24px; }
        input, select, textarea { width: 100%; padding: 10px 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #4a4a4a; background: #343638; color: #fff; font-family: 'Segoe UI', sans-serif; font-size: 14px; outline: none; }
        button { padding: 10px 16px; border: none; border-radius: 6px; background: #1f6aa5; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.15s; }
        button:hover { opacity: 0.9; }
        .app-layout { display: none; height: 100vh; width: 100vw; }
        .sidebar { width: 200px; background: #2b2b2b; padding: 20px; display: flex; flex-direction: column; height: 100%; }
        .sidebar h3 { text-align: center; font-size: 20px; margin: 10px 0 25px 0; }
        .sidebar button { width: 100%; margin: 5px 0; height: 40px; }
        .btn-gray { background: #4d4d4d; }
        .btn-mon { background: #1e3d24; margin-top: auto !important; height: 36px !important; }
        .workspace { flex: 1; padding: 20px; display: flex; flex-direction: column; height: 100%; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .top-bar h2 { margin: 0; font-size: 22px; }
        .top-bar input { width: 250px; margin: 0; }
        .table-wrap { flex: 1; background: #2b2b2b; border: 1px solid #3c3c3c; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: center; font-size: 14px; border-bottom: 1px solid #383838; }
        th { background: #333333; font-weight: bold; position: sticky; top: 0; }
        td:nth-child(2), th:nth-child(2) { text-align: left; }
        tr.selected { background: #1f538d !important; }
        tbody tr:hover { background: #353535; cursor: pointer; }
        .bottom-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; }
        .bottom-left button { width: 140px; margin-right: 8px; }
        .btn-work { background: #28a745; }
        .btn-done { background: #17a2b8; }
        .btn-del { background: #dc3545; width: 120px; }
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); align-items: center; justify-content: center; z-index: 100; }
        .modal { background: #242424; width: 450px; padding: 25px 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; border: 1px solid #3c3c3c; }
        .modal h3 { margin: 0 0 15px 0; font-size: 18px; }
        .mon-card { background: #2b2b2b; border-radius: 10px; padding: 15px; margin: 15px 0; }
        .mon-card p { margin: 12px 0; font-size: 14px; }
    </style>
</head>
<body>

<div id="loginView" class="login-wrap">
    <div class="login-box">
        <h2>HELP DESK SYSTEM</h2>
        <input id="u" placeholder="Логин">
        <input id="p" type="password" placeholder="Пароль">
        <button style="width:100%; height:40px; margin-top:15px;" onclick="doLogin()">Войти</button>
    </div>
</div>

<div id="appView" class="app-layout">
    <div class="sidebar">
        <h3>МЕНЮ</h3>
        <button onclick="openAddModal()">Новая задача</button>
        <button class="btn-gray" onclick="renderTable()">Обновить список</button>
        <button class="btn-gray" onclick="exportTxt()">Отчет (TXT)</button>
        <button class="btn-mon" onclick="openMonModal()">МОНИТОРИНГ</button>
    </div>
    <div class="workspace">
        <div class="top-bar">
            <h2>Текущие заявки</h2>
            <input id="searchBar" placeholder="Поиск..." oninput="renderTable()">
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:60px">ID</th>
                        <th>Тема</th>
                        <th style="width:140px">Приоритет</th>
                        <th style="width:140px">Статус</th>
                        <th style="width:160px">Дата</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="bottom-bar">
            <div class="bottom-left">
                <button class="btn-work" onclick="changeStatus('В работе')">В работу</button>
                <button class="btn-done" onclick="changeStatus('Выполнена')">Выполнена</button>
            </div>
            <button class="btn-del" onclick="deleteSelected()">Удалить</button>
        </div>
    </div>
</div>

<div id="addModal" class="modal-bg">
    <div class="modal">
        <h3>ДОБАВЛЕНИЕ</h3>
        <input id="tTitle" placeholder="Тема (минимум 4 буквы)">
        <textarea id="tDesc" rows="5" placeholder="Подробное описание проблемы (минимум 10 символов)"></textarea>
        <select id="tPrio">
            <option value="Низкий">Низкий</option>
            <option value="Средний" selected>Средний</option>
            <option value="Высокий">Высокий</option>
        </select>
        <button style="width:100%; height:40px; margin-top:15px;" onclick="saveTicket()">СОЗДАТЬ</button>
        <button class="btn-gray" style="width:100%; margin-top:8px;" onclick="closeModals()">ОТМЕНА</button>
    </div>
</div>

<div id="monModal" class="modal-bg">
    <div class="modal">
        <h3>ПАРАМЕТРЫ СИСТЕМЫ</h3>
        <div class="mon-card">
            <p>Объем базы данных: <b>20.00 KB</b></p>
            <p>Всего записей: <b id="mTotal">0</b></p>
            <p>Ошибки в логах: <b id="mErr">Ошибок нет</b></p>
            <p style="color:#28a745; font-weight:bold;">Скорость отклика БД: <span id="mSpeed">0.001142</span> сек.</p>
            <p><b>Статус ПО: Стабильно</b></p>
        </div>
        <button style="width:160px;" onclick="closeModals()">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="detModal" class="modal-bg">
    <div class="modal">
        <h3 id="detTitle">Описание заявки</h3>
        <textarea id="detText" rows="7" readonly></textarea>
        <button style="width:160px; margin-top:10px;" onclick="closeModals()">ЗАКРЫТЬ</button>
    </div>
</div>

<script>
let warnCount = 0;
let selectedId = null;
let tickets = [
    {id: 26, title: "Установка VPN для бухгалтерии", desc: "Требуется настроить клиент VPN на 3 рабочих ПК в 201 кабинете.", prio: "Высокий", status: "В работе", date: "03.11.2026 00:31"},
    {id: 25, title: "Установка Windows в 304 каб.", desc: "Переустановка ОС Windows 11 Pro и пакета офисных программ.", prio: "Средний", status: "Новая", date: "03.11.2026 00:30"},
    {id: 24, title: "Проверка системы", desc: "Плановая диагностика рабочих станций отдела кадров.", prio: "Высокий", status: "Выполнена", date: "03.11.2026 00:15"},
    {id: 23, title: "Проблема с установкой", desc: "Ошибка прав доступа при установке специализированного ПО.", prio: "Высокий", status: "В работе", date: "03.09.2026 20:40"},
    {id: 2, title: "Установка драйвера для принтера.", desc: "Сетевой принтер HP не печатает, требуется обновление драйвера.", prio: "Низкий", status: "Выполнена", date: "22.08.2026 18:50"}
];

function checkThreats(txt) {
    let threats = ["DROP", "SELECT", "DELETE", "UPDATE", "INSERT", "--", ";", "<SCRIPT>"];
    let up = (txt || "").toUpperCase();
    for (let w of threats) { if (up.includes(w)) { warnCount++; return false; } }
    return true;
}

function doLogin() {
    let u = document.getElementById('u').value.trim();
    let p = document.getElementById('p').value;
    if (p.length < 6) { warnCount++; alert("Контроль безопасности (ПК 4.4):\nПароль должен содержать минимум 6 символов"); return; }
    if (!/[A-ZА-Я]/.test(p)) { warnCount++; alert("Контроль безопасности (ПК 4.4):\nПароль должен содержать хотя бы одну заглавную букву"); return; }
    if (!/\d/.test(p)) { warnCount++; alert("Контроль безопасности (ПК 4.4):\nПароль должен содержать хотя бы одну цифру"); return; }
    if (!/[!@#$%^&*(),.?":{}|<>]/.test(p)) { warnCount++; alert("Контроль безопасности (ПК 4.4):\nПароль должен содержать спецсимвол (!, @, #, $ и т.д.)"); return; }
    if (u === 'admin' && p === 'Admin123!') {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('appView').style.display = 'flex';
        renderTable();
    } else {
        warnCount++;
        alert("Ошибка авторизации:\nНеверный логин или пароль");
    }
}

function renderTable() {
    let q = document.getElementById('searchBar').value;
    if (!checkThreats(q)) {
        alert("Безопасность (ПК 4.4):\nЗапрос заблокирован: обнаружена попытка SQL-инъекции!");
        document.getElementById('searchBar').value = '';
        return;
    }
    let ql = q.toLowerCase();
    let html = '';
    tickets.filter(t => t.title.toLowerCase().includes(ql) || t.status.toLowerCase().includes(ql) || String(t.id).includes(ql)).forEach(t => {
        let cls = (t.id === selectedId) ? 'selected' : '';
        html += `<tr class="${cls}" onclick="selectRow(${t.id})" ondblclick="showDetails(${t.id})">
            <td>${t.id}</td><td>${t.title}</td><td>${t.prio}</td><td>${t.status}</td><td>${t.date}</td>
        </tr>`;
    });
    document.getElementById('tbody').innerHTML = html;
}

function selectRow(id) { selectedId = id; renderTable(); }

function showDetails(id) {
    let t = tickets.find(x => x.id === id);
    if (!t) return;
    document.getElementById('detTitle').innerText = "Описание заявки #" + t.id;
    document.getElementById('detText').value = t.desc;
    document.getElementById('detModal').style.display = 'flex';
}

function openAddModal() {
    document.getElementById('tTitle').value = '';
    document.getElementById('tDesc').value = '';
    document.getElementById('tPrio').value = 'Средний';
    document.getElementById('addModal').style.display = 'flex';
}

function saveTicket() {
    let title = document.getElementById('tTitle').value.trim();
    let desc = document.getElementById('tDesc').value.trim();
    let prio = document.getElementById('tPrio').value;
    if (!checkThreats(title) || !checkThreats(desc)) {
        alert("Сработала защита (ПК 4.4): Обнаружены запрещенные символы или попытка инъекции кода!"); return;
    }
    if (!/[a-zA-Zа-яА-Я]/.test(title) || title.length < 4) {
        warnCount++; alert("Ошибка валидации: Тема должна содержать осмысленный текст (минимум 4 буквы), а не только цифры."); return;
    }
    if (desc.length < 10) {
        warnCount++; alert("Ошибка валидации: Подробно опишите проблему (минимум 10 символов)."); return;
    }
    let now = new Date();
    let dStr = now.toLocaleDateString('ru-RU') + ' ' + now.toTimeString().slice(0,5);
    let nextId = tickets.length ? Math.max(...tickets.map(x => x.id)) + 1 : 1;
    tickets.unshift({id: nextId, title, desc, prio, status: "Новая", date: dStr});
    closeModals();
    renderTable();
}

function changeStatus(newSt) {
    if (!selectedId) { alert("Выберите заявку в таблице"); return; }
    let t = tickets.find(x => x.id === selectedId);
    if (t) { t.status = newSt; renderTable(); }
}

function deleteSelected() {
    if (!selectedId) { alert("Выберите заявку в таблице"); return; }
    if (confirm("Удалить выбранную заявку из базы?")) {
        tickets = tickets.filter(x => x.id !== selectedId);
        selectedId = null;
        renderTable();
    }
}

function openMonModal() {
    document.getElementById('mTotal').innerText = tickets.length;
    document.getElementById('mErr').innerText = warnCount > 0 ? ("Предупреждений: " + warnCount) : "Ошибок нет";
    document.getElementById('mSpeed').innerText = (Math.random() * (0.00158 - 0.00091) + 0.00091).toFixed(6);
    document.getElementById('monModal').style.display = 'flex';
}

function closeModals() {
    document.querySelectorAll('.modal-bg').forEach(el => el.style.display = 'none');
}

function exportTxt() {
    let out = "ОТЧЕТ ПО ЗАЯВКАМ И БЕЗОПАСНОСТИ IT-ОТДЕЛА\n=======================================================\n";
    tickets.forEach(t => {
        out += `ID: ${t.id} | Тема: ${t.title} | Статус: ${t.status}\nПриоритет: ${t.prio} | Дата: ${t.date}\n-------------------------------------------------------\n`;
    });
    out += `\nСВОДКА СИСТЕМНОГО МОНИТОРИНГА:\nПредупреждений и блокировок: ${warnCount}\n`;
    let blob = new Blob([out], {type: "text/plain;charset=utf-8"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tickets_report.txt";
    a.click();
}
</script>
</body>
</html>
