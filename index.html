<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Система HelpDesk v.1.2</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #fff; }
        .login-box { width: 340px; margin: 120px auto; background: #2b2b2b; padding: 30px; border-radius: 15px; text-align: center; }
        input, select, textarea { width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; }
        button { padding: 10px 20px; border: none; border-radius: 6px; background: #1f538d; color: #fff; font-weight: bold; cursor: pointer; margin: 5px; }
        .layout { display: none; height: 100vh; }
        .side { width: 220px; background: #252526; padding: 20px; float: left; height: 100%; box-sizing: border-box; }
        .side button { width: 100%; margin: 6px 0; }
        .main { margin-left: 240px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: #2b2b2b; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #3c3c3c; text-align: left; }
        th { background: #333; }
        tr:hover { background: #1f538d; cursor: pointer; }
    </style>
</head>
<body>
<div id="loginView" class="login-box">
    <h2>HELP DESK SYSTEM</h2>
    <input id="u" placeholder="Логин (admin)">
    <input id="p" type="password" placeholder="Пароль (Admin123!)">
    <button style="width:95%" onclick="login()">Войти</button>
</div>
<div id="appView" class="layout">
    <div class="side">
        <h3>МЕНЮ</h3>
        <button onclick="addTicket()">Новая задача</button>
        <button style="background:#444" onclick="render()">Обновить список</button>
        <button style="background:#1e3d24" onclick="alert('Объем БД: 20.00 KB\nВсего записей: '+tickets.length+'\nОшибки в логах: Ошибок нет\nСкорость отклика БД: 0.001142 сек.\nСтатус ПО: Стабильно')">МОНИТОРИНГ</button>
    </div>
    <div class="main">
        <h2>Текущие заявки</h2>
        <input id="search" placeholder="Поиск..." style="width:260px" oninput="render()">
        <table>
            <thead><tr><th>ID</th><th>Тема</th><th>Приоритет</th><th>Статус</th><th>Дата</th><th>Действия</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>
<script>
let tickets = [
    {id: 26, title: "Установка VPN для бухгалтерии", prio: "Высокий", status: "В работе", date: "03.11.2026 00:31"},
    {id: 25, title: "Установка Windows в 304 каб.", prio: "Средний", status: "Новая", date: "03.11.2026 00:30"},
    {id: 24, title: "Проверка системы", prio: "Высокий", status: "Выполнена", date: "03.11.2026 00:15"},
    {id: 2, title: "Установка драйвера для принтера", prio: "Низкий", status: "Выполнена", date: "22.08.2026 18:50"}
];
function login() {
    let p = document.getElementById('p').value;
    if (p.length < 6 || !/[A-ZА-Я]/.test(p) || !/[!@#$%^&*]/.test(p)) {
        alert("Контроль безопасности (ПК 4.4): Пароль должен быть от 6 символов, с заглавной буквой и спецсимволом!"); return;
    }
    if (document.getElementById('u').value === 'admin' && p === 'Admin123!') {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('appView').style.display = 'block';
        render();
    } else alert("Неверный логин или пароль");
}
function render() {
    let q = document.getElementById('search').value.toLowerCase();
    if (q.includes('drop') || q.includes('select') || q.includes(';')) { alert("Запрос заблокирован: SQL-инъекция!"); document.getElementById('search').value=''; return; }
    let html = '';
    tickets.filter(t => t.title.toLowerCase().includes(q) || String(t.id).includes(q)).forEach(t => {
        html += `<tr><td>${t.id}</td><td>${t.title}</td><td>${t.prio}</td><td>${t.status}</td><td>${t.date}</td>
        <td><button style="background:#28a745;padding:5px 10px" onclick="setSt(${t.id},'В работе')">В работу</button>
        <button style="background:#17a2b8;padding:5px 10px" onclick="setSt(${t.id},'Выполнена')">Выполнена</button></td></tr>`;
    });
    document.getElementById('tbody').innerHTML = html;
}
function setSt(id, st) { let t = tickets.find(x => x.id === id); if (t) t.status = st; render(); }
function addTicket() {
    let title = prompt("Введите тему заявки (минимум 4 буквы):");
    if (!title || !/[a-zA-Zа-яА-Я]{4,}/.test(title)) { alert("Ошибка валидации: Тема должна содержать буквы!"); return; }
    tickets.unshift({id: tickets.length + 27, title: title, prio: "Средний", status: "Новая", date: "03.11.2026 12:00"});
    render();
}
</script>
</body>
</html>
